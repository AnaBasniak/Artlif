apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
template:
    metadata:
      labels:
        app: postgres
    spec:
        containers:
        - name: postgres
        image: postgres:15-alpine #
        env:
        - name: 
          valueFrom:
          secretKeyRef:
              name: artbackend-postgres-secret
              key: postgres
        - name: postgres #
          valueFrom:
            secretKeyRef:
              name: artbackend-postgres-secret
              key:  postgres #
        - name:  postgres
          valueFrom:
            secretKeyRef:
              name: artbackend-postgres-secret
              key: postgres #
        ports:
        - containerPort: 5432
        volumeMounts:
          mountPath: /var/lib/postgresql/data
          name: postgres-database
        volumes:
        - name: postgres-database
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres